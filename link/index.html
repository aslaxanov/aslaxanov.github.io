.cta { width: 100%; }
.cta > span:last-child { flex: 1; text-align: center; text-wrap: balance; padding-right: 34px; }
@media (max-width: 440px) { .cta { padding-right: 14px; font-size: .9rem; } .cta > span:last-child { padding-right: 0; } }
.glow { position: fixed; z-index: -1; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgb(159 227 193 / .16), transparent 65%); top: 8%; left: 50%; translate: -50% 0; animation: drift 12s ease-in-out infinite; pointer-events: none; }
</style>
